name: Official Ardour metadata-only import probe
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Authenticated Debian tools
        run: |
          apt-get update -o APT::Update::Error-Mode=any
          apt-get install -y --no-install-recommends ca-certificates python3 python3-pyatspi python3-pil python3-mido xdotool xclip scrot xvfb xauth openbox dbus-x11 fonts-dejavu-core tesseract-ocr
      - name: Verify exact official packages before native execution
        run: python3 scripts/package-pin.py
      - name: Real native Lua authoring and GUI file import
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- sh -c 'openbox > /tmp/beatcourier-openbox.log 2>&1 & python3 scripts/gui-probe.py'
      - name: Preserve bounded probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beatcourier-native-probe
          path: artifacts/native
          if-no-files-found: error
