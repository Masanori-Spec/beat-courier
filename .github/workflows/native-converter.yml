name: Official Ardour production converter gate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-converter:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticated Debian tools
        run: |
          apt-get update -o APT::Update::Error-Mode=any
          apt-get install -y --no-install-recommends ca-certificates nodejs npm python3 python3-pyatspi python3-pil python3-mido xdotool xclip scrot xvfb xauth openbox dbus-x11 fonts-dejavu-core tesseract-ocr
      - name: Bounded inert converter tests
        run: |
          npm ci --ignore-scripts
          npm test
          python3 scripts/oracle-selftest.py
      - name: Verify exact official packages before native execution
        run: python3 scripts/package-pin.py
      - name: Actual converter MIDI through native import save and fresh reload
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- sh -c 'openbox > /tmp/beatcourier-openbox.log 2>&1 & python3 scripts/gui-full-gate.py'
      - name: Preserve bounded original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beatcourier-native-converter
          path: artifacts/native
          if-no-files-found: error
